<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPELL EXCEPTION</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(160deg, #fff0f5 0%, #ffe4ec 40%, #ffd6e7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 30px 20px;
      color: #c2185b;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== RAINBOW BORDER (Top, Bottom, Left, Right) ===== */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      padding: 8px;
      background: linear-gradient(
        90deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #0000ff,
        #4b0082,
        #9400d3,
        #ff0000
      );
      background-size: 400% 400%;
      animation: rainbowMove 8s linear infinite;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes rainbowMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    /* Soft glow behind the rainbow */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 40px rgba(255, 105, 180, 0.25);
      pointer-events: none;
      z-index: 998;
    }

    h1 {
      font-size: clamp(1.7rem, 5.5vw, 2.6rem);
      margin-bottom: 8px;
      text-align: center;
      color: #ad1457;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(233, 30, 99, 0.25);
    }

    .subtitle {
      font-size: 1.05rem;
      color: #e91e63;
      margin-bottom: 32px;
      opacity: 0.9;
      letter-spacing: 0.5px;
    }

    .word-display {
      font-size: clamp(1.9rem, 6.5vw, 3rem);
      letter-spacing: 11px;
      margin-bottom: 38px;
      color: #c2185b;
      min-height: 60px;
      font-weight: bold;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-shadow: 0 3px 10px rgba(194, 24, 91, 0.2);
    }

    .word-display.correct {
      color: #e91e63;
      transform: scale(1.08);
      text-shadow: 0 0 25px rgba(233, 30, 99, 0.55);
    }

    .word-display.wrong {
      animation: shake 0.45s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      max-width: 540px;
      width: 100%;
      margin-bottom: 20px;
    }

    .key {
      background: linear-gradient(180deg, #ff8fb3, #ff6b9d);
      border: none;
      border-radius: 14px;
      padding: 14px 0;
      text-align: center;
      font-size: 1.15rem;
      color: white;
      cursor: pointer;
      user-select: none;
      transition: all 0.18s ease;
      box-shadow: 0 5px 0 #e91e63, 0 6px 12px rgba(233, 30, 99, 0.25);
      font-family: inherit;
      font-weight: 500;
    }

    .key:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #e91e63, 0 10px 18px rgba(233, 30, 99, 0.3);
      filter: brightness(1.08);
    }

    .key:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #e91e63;
    }

    .key.special {
      background: linear-gradient(180deg, #d81b60, #ad1457);
      box-shadow: 0 5px 0 #880e4f, 0 6px 12px rgba(136, 14, 79, 0.3);
      font-size: 1rem;
    }

    .key.special:hover {
      box-shadow: 0 8px 0 #880e4f, 0 10px 18px rgba(136, 14, 79, 0.35);
    }

    .key.special:active {
      box-shadow: 0 2px 0 #880e4f;
    }

    .enter {
      grid-column: span 2;
    }

    .backspace {
      grid-column: span 2;
    }

    .message {
      margin-top: 18px;
      font-size: 1.2rem;
      color: #ad1457;
      height: 30px;
      font-weight: 500;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    .message.success {
      color: #e91e63;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(233, 30, 99, 0.4);
    }

    /* Video Overlay */
    #videoContainer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 1000;
      animation: fadeIn 0.45s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #videoContainer video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 22px;
      right: 22px;
      background: linear-gradient(135deg, #ff80ab, #ff4081);
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 50px;
      font-size: 1.05rem;
      cursor: pointer;
      z-index: 1001;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transition: all 0.25s ease;
      font-family: inherit;
      font-weight: 500;
    }

    .close-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 64, 129, 0.5);
    }

    /* Floating hearts + sparkles */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      animation: floatUp 2.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-140px) scale(0.5) rotate(25deg);
      }
    }

    /* Subtle floating hearts in background */
    .bg-heart {
      position: fixed;
      font-size: 18px;
      color: rgba(233, 30, 99, 0.12);
      pointer-events: none;
      animation: drift 12s linear infinite;
      z-index: 1;
    }

    @keyframes drift {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    /* Mobile adjustments */
    @media (max-width: 500px) {
      body {
        padding: 25px 12px;
      }
      .keyboard {
        gap: 6px;
      }
      .key {
        padding: 12px 0;
        font-size: 1rem;
        border-radius: 11px;
      }
      .word-display {
        letter-spacing: 7px;
      }
      body::before {
        padding: 6px;
      }
    }
  </style>
</head>
<body>

  <h1>Spell "EXCEPTION"</h1>
  <p class="subtitle">Type the word correctly ✨</p>

  <div class="word-display" id="display">_ _ _ _ _ _ _ _ _</div>

  <div class="keyboard" id="keyboard"></div>

  <div class="message" id="message"></div>

  <!-- Video -->
  <div id="videoContainer">
    <button class="close-btn" onclick="closeVideo()">Close ♡</button>
    <video id="vid" controls playsinline>
      <source src="Video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const target = "EXCEPTION";
    let current = "";

    const display = document.getElementById("display");
    const message = document.getElementById("message");
    const keyboard = document.getElementById("keyboard");
    const videoContainer = document.getElementById("videoContainer");
    const vid = document.getElementById("vid");

    // Create letter keys
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    letters.forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "key";
      btn.textContent = letter;
      btn.onclick = () => press(letter);
      keyboard.appendChild(btn);
    });

    // Backspace
    const backspace = document.createElement("button");
    backspace.className = "key special backspace";
    backspace.textContent = "⌫";
    backspace.onclick = () => {
      current = current.slice(0, -1);
      updateDisplay();
      message.textContent = "";
      display.classList.remove("wrong", "correct");
    };
    keyboard.appendChild(backspace);

    // Enter
    const enter = document.createElement("button");
    enter.className = "key special enter";
    enter.textContent = "ENTER";
    enter.onclick = check;
    keyboard.appendChild(enter);

    function press(letter) {
      if (current.length < target.length) {
        current += letter;
        updateDisplay();
        message.textContent = "";
        display.classList.remove("wrong", "correct");
      }
    }

    function updateDisplay() {
      let shown = "";
      for (let i = 0; i < target.length; i++) {
        shown += (current[i] || "_") + " ";
      }
      display.textContent = shown.trim();
    }

    function check() {
      if (current === target) {
        message.textContent = "Correct! ♡";
        message.classList.add("success");
        display.classList.add("correct");
        createParticles();
        
        setTimeout(() => {
          videoContainer.style.display = "block";
          vid.play().catch(() => {});
        }, 700);
      } else {
        message.textContent = "Wrong, try again ♡";
        message.classList.remove("success");
        display.classList.add("wrong");
        
        setTimeout(() => {
          current = "";
          updateDisplay();
          display.classList.remove("wrong");
        }, 550);
      }
    }

    function closeVideo() {
      vid.pause();
      vid.currentTime = 0;
      videoContainer.style.display = "none";
      current = "";
      updateDisplay();
      message.textContent = "";
      message.classList.remove("success");
      display.classList.remove("correct");
    }

    function createParticles() {
      const symbols = ["♡", "✨", "💖", "🌸", "★"];
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const p = document.createElement("div");
          p.className = "particle";
          p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          p.style.left = Math.random() * 100 + "vw";
          p.style.top = (55 + Math.random() * 25) + "vh";
          p.style.fontSize = (16 + Math.random() * 22) + "px";
          p.style.color = `hsl(${320 + Math.random() * 40}, 85%, 65%)`;
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 2800);
        }, i * 60);
      }
    }

    // Background floating hearts
    function createBgHearts() {
      setInterval(() => {
        const h = document.createElement("div");
        h.className = "bg-heart";
        h.textContent = "♡";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (14 + Math.random() * 16) + "px";
        h.style.animationDuration = (10 + Math.random() * 8) + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 18000);
      }, 1800);
    }
    createBgHearts();

    // Keyboard support
    document.addEventListener("keydown", (e) => {
      const key = e.key.toUpperCase();
      if (key >= "A" && key <= "Z") press(key);
      if (e.key === "Enter") check();
      if (e.key === "Backspace") {
        current = current.slice(0, -1);
        updateDisplay();
        message.textContent = "";
        display.classList.remove("wrong", "correct");
      }
    });
  </script>
</body>
</html>
